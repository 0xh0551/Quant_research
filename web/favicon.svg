<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Quant Research">
  <!-- Favicon rendition of the quant mark. Same 4×3 lattice and same lit scan
       cell as brand/quant-mark.svg, redrawn to survive 16px: a plate for
       contrast on any tab strip, margins cut to a tenth, cells enlarged
       relative to their spacing, and the opacity ramp lifted so that no cell
       drops out at tab size. -->
  <rect width="64" height="64" rx="14" fill="#0F1626"/>
  <g fill="#7B93D6">
    <rect x="5.5"  y="13" width="8" height="8" rx="2.4" opacity=".45"/>
    <rect x="5.5"  y="28" width="8" height="8" rx="2.4" opacity=".45"/>
    <rect x="5.5"  y="43" width="8" height="8" rx="2.4" opacity=".45"/>
    <rect x="20.5" y="13" width="8" height="8" rx="2.4" opacity=".58"/>
    <rect x="20.5" y="28" width="8" height="8" rx="2.4" opacity=".80"/>
    <rect x="20.5" y="43" width="8" height="8" rx="2.4" opacity=".58"/>
    <rect x="35.5" y="13" width="8" height="8" rx="2.4" opacity=".64"/>
    <rect x="35.5" y="43" width="8" height="8" rx="2.4" opacity=".72"/>
    <rect x="50.5" y="13" width="8" height="8" rx="2.4" opacity=".45"/>
    <rect x="50.5" y="28" width="8" height="8" rx="2.4" opacity=".52"/>
    <rect x="50.5" y="43" width="8" height="8" rx="2.4" opacity=".45"/>
  </g>
  <rect x="32.9" y="25.4" width="13.2" height="13.2" rx="4" fill="#5EE6D0" opacity=".24"/>
  <rect x="34.7" y="27.2" width="9.6" height="9.6" rx="2.9" fill="#5EE6D0"/>
</svg>
